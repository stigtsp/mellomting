name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        # go.mod pins the toolchain; go-version-file picks it up.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # The pin has to keep up with the toolchain in go.mod: staticcheck
      # reads the compiler's export data for stdlib imports, and a
      # release that predates the toolchain fails every package with
      # "export data version N is greater than maximum supported
      # version M" before it analyses anything. v0.8.1 reads Go 1.27.
      - name: Static check (staticcheck v0.8.1)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Vulnerability check (govulncheck x/vuln v1.7.0)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Fuzz all targets (short smoke)
        # PLAN §80: every Fuzz* target gets a short fuzz run in CI, not
        # just FuzzParse and not merely a seed replay (-fuzz with a real
        # -fuzztime mutates inputs). Target names are discovered from the
        # sources so a newly added target is picked up automatically.
        run: |
          set -euo pipefail
          # Both the package list and the target names are derived from
          # the sources. Hardcoding the packages meant a target in an
          # unlisted package (internal/discovery) was never fuzzed
          # despite this job claiming to cover every one.
          pkgs=$(grep -rlE '^func Fuzz' --include='*_test.go' . | xargs -n1 dirname | sort -u)
          for pkg in $pkgs; do
            fns=$(grep -hoE '^func Fuzz[A-Za-z0-9_]+' "$pkg"/*_test.go | sed 's/^func //' | sort -u)
            for f in $fns; do
              echo "=== fuzz $f ($pkg) ==="
              go test -run='^$' -fuzz="^${f}\$" -fuzztime=15s "$pkg"
            done
          done

  landlock:
    name: landlock acceptance (ABI >= 6 required)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The Landlock acceptance tests need kernel ABI >= 6. MELLOMTING_
      # LANDLOCK_STRICT turns any skip into a failure, so the ABI-6/TSYNC
      # fix and the required-mode serve path are proven to have executed
      # (FIX-02/X2 of FIX_REVIEW_2026-08-22). On a runner without an
      # ABI >= 6 kernel this job fails loudly instead of silently
      # skipping the acceptance tests.
      - name: Landlock acceptance (strict)
        run: MELLOMTING_LANDLOCK_STRICT=1 go test -count=1 -run 'TestAllThreadsEnforced|TestScopedAbstractSocket' ./internal/landlock/

      - name: Landlock required-mode serve tests (strict)
        run: MELLOMTING_LANDLOCK_STRICT=1 go test -count=1 -run 'TestServeSandboxRequiredApplies' ./cmd/mellomting/

      # The shipped unit filters syscalls, and @sandbox (the landlock_*
      # calls) is NOT part of @system-service — filtering without it would
      # make the daemon's own confinement fail at startup. Run the
      # Landlock acceptance tests under the exact directives deploy/
      # ships, read out of the unit so this can never drift from it.
      - name: Shipped syscall filter permits Landlock
        run: |
          set -euo pipefail
          filter=$(sed -n 's/^SystemCallFilter=//p' deploy/mellomting.service)
          arches=$(sed -n 's/^SystemCallArchitectures=//p' deploy/mellomting.service)
          test -n "$filter" && test -n "$arches"
          echo "unit filter: $filter / $arches"
          go test -c -o /tmp/landlock.test ./internal/landlock/
          sudo systemd-run --wait --pipe --collect \
            --setenv=MELLOMTING_LANDLOCK_STRICT=1 \
            --property="SystemCallFilter=$filter" \
            --property="SystemCallArchitectures=$arches" \
            --property=NoNewPrivileges=yes \
            /tmp/landlock.test -test.run 'TestAllThreadsEnforced|TestScopedAbstractSocket' -test.v

  integration:
    name: integration journeys (build-tagged)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The journeys sit behind //go:build integration, so the quality
      # job's `go test ./...` never compiles them, let alone runs them.
      # They drive the real binary end to end (init, key create, serve,
      # request) against local fake model servers.
      - name: Integration journeys
        run: go test -count=1 -tags integration ./integration/

  nonlinux:
    name: non-linux build (darwin) vet+test
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The landlock_other/apply_other build and TestApplyNonLinuxFailsClosed
      # only exist on non-Linux: on an ubuntu runner this test takes its
      # Linux branch, so its fail-closed assertion never runs (T-Q3).
      - name: Vet (darwin)
        run: go vet ./...

      - name: Test (darwin)
        run: go test ./...

      # Seatbelt enforcement is the one thing that cannot be proven off
      # macOS, and TestApplyEnforces skips when the host process is
      # itself sandboxed — invisible in the run above. STRICT turns that
      # skip into a failure, so this step is what stands behind the
      # claim that the profile confines anything at all. The equivalent
      # Landlock gate is the landlock job.
      - name: Seatbelt enforcement (strict)
        run: MELLOMTING_SEATBELT_STRICT=1 go test -count=1 -run 'TestApplyEnforces|TestServeSandboxRequired' ./internal/seatbelt/ ./cmd/mellomting/

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Version embedding is a release concern (Makefile); this job proves
      # every primary target compiles as a static build.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -o /dev/null ./cmd/mellomting

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        # go.mod pins the toolchain; go-version-file picks it up.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Static check (staticcheck v0.7.0)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Vulnerability check (govulncheck x/vuln v1.7.0)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Fuzz config parser (15s smoke)
        run: go test -run=NONE -fuzz=FuzzParse -fuzztime=15s ./internal/config

  landlock:
    name: landlock acceptance (ABI >= 6 required)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The Landlock acceptance tests need kernel ABI >= 6. MELLOMTING_
      # LANDLOCK_STRICT turns any skip into a failure, so the ABI-6/TSYNC
      # fix and the required-mode serve path are proven to have executed
      # (FIX-02/X2 of FIX_REVIEW_2026-08-22). On a runner without an
      # ABI >= 6 kernel this job fails loudly instead of silently
      # skipping the acceptance tests.
      - name: Landlock acceptance (strict)
        run: MELLOMTING_LANDLOCK_STRICT=1 go test -count=1 -run 'TestAllThreadsEnforced|TestScopedAbstractSocket' ./internal/landlock/

      - name: Landlock required-mode serve tests (strict)
        run: MELLOMTING_LANDLOCK_STRICT=1 go test -count=1 -run 'TestServeSandboxRequiredApplies' ./cmd/mellomting/

  nonlinux:
    name: non-linux build (darwin) vet+test
    runs-on: macos-latest
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The landlock_other/apply_other build and TestApplyNonLinuxFailsClosed
      # only exist on non-Linux: on an ubuntu runner this test takes its
      # Linux branch, so its fail-closed assertion never runs (T-Q3).
      - name: Vet (darwin)
        run: go vet ./...

      - name: Test (darwin)
        run: go test ./...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Version embedding is a release concern (Makefile); this job proves
      # every primary target compiles as a static build.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -trimpath -o /dev/null ./cmd/mellomting
